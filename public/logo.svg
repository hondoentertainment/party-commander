<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="crown" x1="128" y1="120" x2="384" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bolt" x1="230" y1="200" x2="290" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="boltGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="rgba(16,185,129,0.15)" stroke-width="2"/>

  <!-- Crown shape — five-pointed party crown -->
  <g filter="url(#glow)">
    <path d="
      M 108 340
      L 140 160
      L 196 240
      L 256 130
      L 316 240
      L 372 160
      L 404 340
      Z
    " fill="url(#crown)" opacity="0.95"/>
  </g>

  <!-- Crown band / base -->
  <rect x="108" y="328" width="296" height="40" rx="8" fill="url(#crown)" opacity="0.85"/>

  <!-- Crown jewel dots -->
  <circle cx="192" cy="290" r="12" fill="#fbbf24" opacity="0.9"/>
  <circle cx="256" cy="260" r="14" fill="#fbbf24" opacity="0.95"/>
  <circle cx="320" cy="290" r="12" fill="#fbbf24" opacity="0.9"/>

  <!-- Lightning bolt overlay — the "Commander" element -->
  <g filter="url(#boltGlow)">
    <path d="
      M 272 175
      L 238 270
      L 268 270
      L 240 370
      L 300 255
      L 268 255
      Z
    " fill="url(#bolt)" opacity="0.95"/>
  </g>

  <!-- Sparkle accents -->
  <circle cx="148" cy="180" r="4" fill="#34d399" opacity="0.7"/>
  <circle cx="364" cy="180" r="4" fill="#34d399" opacity="0.7"/>
  <circle cx="256" cy="405" r="3" fill="#34d399" opacity="0.5"/>
</svg>
